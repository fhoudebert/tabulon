# Tabulon : binaires Tauri pour Linux, Windows et macOS.
# - jocly : dist de jocly2 (branche JOCLY2_REF) construit une fois, puis le
#   dist-minimal embarque qui en est tire ; les deux deviennent des artefacts,
#   avec dist-selection : les jeux de selection.txt (gulp --games, --prod)
# - desktop : tests Rust puis build de release sur chaque systeme
#     Linux   : AppImage (purgee des libwayland-*, via compil.sh), .deb, .rpm,
#               en x86_64 et en ARM64 (runner ARM natif : Tauri ne croise pas)
#               Deux AppImages, qui se mettent a jour (AppImageUpdate, .zsync) :
#                 Tabulon-minimal-<version>-<arch>.AppImage : le dist minimal,
#                   a completer par un dist/ externe ou des extensions
#                 Tabulon-selection-<version>-<arch>.AppImage : les jeux de
#                   selection.txt, prete a jouer ; celle d'appimage.github.io
#     Windows : installeurs NSIS (.exe) et MSI, plus l'exe seul, en x64 ;
#               en ARM64 (runner ARM natif windows-11-arm) : NSIS et exe seul
#     macOS   : une seule application pour Apple silicon et Intel (universelle),
#               en .dmg et en .app zippee, signee ad hoc (pas notarisee)
# - msrv : l'application testee avec sa Rust minimale (1.90, rust-version)
# - release : pour une etiquette, les paquets publies dans sa release
# Lance a la main (Actions > Release > Run workflow), ou en poussant une
# etiquette v* (git tag vX.Y.Z && git push origin vX.Y.Z) : les paquets sont
# alors aussi publies dans la release de cette etiquette (creee au besoin).
# Les suites JS + Rust de non-regression restent dans tests.yml, a chaque push.
name: Release (Linux, Windows, macOS)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  JOCLY2_REF: main
  # modules embarques dans dist-minimal, separes par des virgules (lu par
  # make-minimal-dist.mjs ; vide = son defaut, kriegspiel)
  TABULON_MODULES: ""

jobs:
  jocly:
    name: Jocly dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout jocly2 (${{ env.JOCLY2_REF }})
        uses: actions/checkout@v7
        with:
          repository: fhoudebert/jocly2
          ref: ${{ env.JOCLY2_REF }}
          path: jocly2

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # gulp vide dist/ a chaque build : la selection est copiee (browser/
      # seulement, l'application n'utilise pas node/) avant le build complet
      - name: Build the jocly2 dists (selection, then full)
        working-directory: jocly2
        run: |
          npm install --no-audit --no-fund
          npx gulp --games "$(node ../scripts/selection-games.mjs)" build --prod
          mkdir -p ../dist-selection
          cp -r dist/browser ../dist-selection/
          npx gulp build

      # gulp --games ignore un nom inconnu sans rien dire : chaque jeu de
      # selection.txt doit etre dans le dist construit
      - name: Selection check
        run: node scripts/selection-games.mjs --check dist-selection

      # check-dist genere dist-minimal (TABULON_MODULES) et echoue s'il est
      # vide ou sans moteur (une app sans aucun jeu a deja ete livree ainsi)
      - name: Embedded dist (dist-minimal)
        run: |
          ln -s "$PWD/jocly2/dist" dist
          npm run check:dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-minimal
          path: dist-minimal
          if-no-files-found: error
          retention-days: 7

      # embarque tel quel dans Tabulon-selection (comme dist-minimal)
      - uses: actions/upload-artifact@v7
        with:
          name: dist-selection
          path: dist-selection
          if-no-files-found: error
          retention-days: 7

      # la ludotheque complete, a poser en dist/ a cote de l'executable
      - uses: actions/upload-artifact@v7
        with:
          name: jocly-dist
          path: jocly2/dist
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Desktop application (${{ matrix.name }})
    needs: jocly
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 : glibc la plus ancienne disponible, donc AppImage et .deb
          # utilisables sur le plus grand nombre de distributions
          - os: ubuntu-22.04
            name: linux-x64
            variant: minimal
            build: ./compil.sh
            bundle: src-tauri/target/release/bundle
          # ARM64 (Raspberry Pi 4/5 en 64 bits, portables Snapdragon, serveurs
          # ARM) : runner ARM natif, gratuit pour les depots publics ; meme
          # 22.04 que ci-dessus pour la meme raison de glibc
          - os: ubuntu-22.04-arm
            name: linux-arm64
            variant: minimal
            build: ./compil.sh
            bundle: src-tauri/target/release/bundle
          # Tabulon-selection : AppImage seule, dist-selection embarque a la
          # place de dist-minimal ; meme glibc (22.04) que ci-dessus
          - os: ubuntu-22.04
            name: linux-x64-selection
            variant: selection
            dist: dist-selection
            build: ./compil.sh --bundles appimage
            bundle: src-tauri/target/release/bundle
          - os: ubuntu-22.04-arm
            name: linux-arm64-selection
            variant: selection
            dist: dist-selection
            build: ./compil.sh --bundles appimage
            bundle: src-tauri/target/release/bundle
          - os: windows-latest
            name: windows
            build: npm run build
            bundle: src-tauri/target/release/bundle
          # ARM64 (Snapdragon X, Surface Pro...) : runner ARM natif, gratuit pour
          # les depots publics, comme pour Linux ; Tauri ne fait pas de MSI
          # ARM64 (WiX), seulement l'installeur NSIS
          - os: windows-11-arm
            name: windows-arm64
            build: npm run build -- --bundles nsis
            bundle: src-tauri/target/release/bundle
            portable: Tabulon-portable-arm64.exe
          # une seule application pour Apple silicon et Intel ; signature ad hoc
          # ("-") : sans elle le binaire arm64 est refuse par macOS, et sans
          # certificat Apple on ne peut pas faire mieux
          - os: macos-latest
            name: macos
            build: >-
              npm run build -- --target universal-apple-darwin --bundles app,dmg
              --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      # le dist embarque : dist-minimal, ou dist-selection pour Tabulon-selection
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.dist || 'dist-minimal' }}
          path: dist-minimal

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Tauri command line
        run: npm ci --no-audit --no-fund

      # une fois par systeme : la variante selection ne change que le dist
      - name: Rust tests
        if: matrix.variant != 'selection'
        working-directory: src-tauri
        run: cargo test --locked

      # Linux : TABULON_VARIANT nomme l'AppImage Tabulon-<variante>-<version>-
      # <arch> et TABULON_UPDATE_REPO y inscrit sa mise a jour
      # (gh-releases-zsync, derniere release de ce depot), avec le .zsync a
      # publier a cote (scripts/fix-appimage.mjs) ; sans effet ailleurs
      - name: Build
        shell: bash
        env:
          TABULON_VARIANT: ${{ matrix.variant }}
          TABULON_UPDATE_REPO: ${{ matrix.variant && github.repository || '' }}
        run: ${{ matrix.build }}

      # upload-artifact perd les droits d'execution : l'AppImage est remise
      # telle quelle (chmod +x apres telechargement), la .app est zippee avec
      # ditto pour garder sa structure et sa signature
      - name: Collect (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          # fichiers publies en « Tabulon* » (productName) ; le nom du paquet
          # .deb/.rpm reste « tabulon », en minuscules comme Debian et RPM
          # l'exigent : une installation existante se met a jour. Le renommage
          # ci-dessous ne sert que si un outil de paquet ecrit encore le fichier
          # en minuscules
          for f in ${{ matrix.bundle }}/deb/*.deb ${{ matrix.bundle }}/rpm/*.rpm; do
            if [ -e "$f" ]; then
              name="$(basename "$f")"
              cp "$f" "out/Tabulon${name#[Tt]abulon}"
            fi
          done
          # l'AppImage et son .zsync, deja sous leur nom publie (compil.sh) :
          # le .zsync designe l'AppImage par son nom, ne pas la renommer
          cp ${{ matrix.bundle }}/appimage/Tabulon-${{ matrix.variant }}-*.AppImage out/
          cp ${{ matrix.bundle }}/appimage/Tabulon-${{ matrix.variant }}-*.AppImage.zsync out/
          # l'executable seul, comme Tabulon-portable.exe sous Windows : il
          # n'embarque PAS WebKitGTK (a installer : libwebkit2gtk-4.1), au
          # contraire de l'AppImage ; nomme comme l'artefact (linux-x64,
          # linux-arm64) pour ne pas confondre les deux architectures. Le binaire
          # lui-meme reste « tabulon » (mainBinaryName)
          if [ "${{ matrix.variant }}" = minimal ]; then
            cp src-tauri/target/release/tabulon "out/Tabulon-${{ matrix.name }}"
          fi
          ls -l out

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp ${{ matrix.bundle }}/nsis/*.exe out/
          # pas de MSI en ARM64
          if compgen -G "${{ matrix.bundle }}/msi/*.msi" > /dev/null; then
            cp ${{ matrix.bundle }}/msi/*.msi out/
          fi
          # l'exe seul, nomme selon l'architecture (Tabulon-portable.exe en x64)
          cp src-tauri/target/release/tabulon.exe "out/${{ matrix.portable || 'Tabulon-portable.exe' }}"
          file out/* 2>/dev/null || true
          ls -l out

      - name: Collect (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          cp ${{ matrix.bundle }}/dmg/*.dmg out/
          app="$(ls -d ${{ matrix.bundle }}/macos/*.app | head -1)"
          codesign --verify --deep --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/tabulon"
          ditto -c -k --keepParent "$app" "out/$(basename "$app" .app)-universal.app.zip"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: Tabulon-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  # la plus ancienne Rust avec laquelle l'application compile (rust-version
  # dans Cargo.toml), avec les dependances verrouillees
  msrv:
    name: Rust 1.90 (minimum)
    needs: jocly
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist-minimal
          path: dist-minimal

      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@1.90

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tests with the locked dependencies
        working-directory: src-tauri
        run: cargo test --locked

  # pour une etiquette : les paquets de chaque systeme dans la release (le
  # dist jocly complet n'y va pas : il est publie dans les releases de jocly2)
  release:
    name: Release
    needs: [desktop, msrv]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Tabulon-*
          path: out
          merge-multiple: true

      - name: Publication dans la release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l out
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "Tabulon $TAG" \
                 --notes "Tabulon pour Linux (x86-64, ARM64 : AppImages Tabulon-selection, prete a jouer, et Tabulon-minimal, mises a jour par AppImageUpdate ; .deb, .rpm, executable seul), Windows x64 (installeurs NSIS et MSI, exe portable) et ARM64 (installeur NSIS, exe portable) et macOS (application universelle, signee ad hoc)."
          gh release upload "$TAG" out/* --clobber
