# Suites de non-regression : JS (jsdom + dist jocly2 reel) et Rust.
#
# Le dist de jocly2 n'est pas versionne ici : il est construit depuis la
# branche indiquee par JOCLY2_REF, celle avec laquelle cette branche de
# Tabulon est livree. La changer en meme temps que la branche cible.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  JOCLY2_REF: next

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout jocly2 (${{ env.JOCLY2_REF }})
        uses: actions/checkout@v4
        with:
          repository: fhoudebert/jocly2
          ref: ${{ env.JOCLY2_REF }}
          path: jocly2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the jocly2 dist
        working-directory: jocly2
        run: npm install --no-audit --no-fund && npx gulp build

      - name: Prepare dist/, dist-minimal/ and jsdom
        run: |
          ln -s "$PWD/jocly2/dist" dist
          npm --prefix app install --no-audit --no-fund
          npm run check:dist

      - name: JavaScript suites
        run: npm test

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        run: npm run test:rust
