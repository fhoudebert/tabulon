<!DOCTYPE html>
<html style="height:100%">

<head>
	<meta charset="utf-8">
		<link rel="icon" href="data:,">
	<title>Tabulon</title>

	<!-- Stylesheets -->
	<link rel="stylesheet" href="tabulon.css">

	<!-- Javascript -->
	<script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
	<script src="../node_modules/jquery/dist/jquery.js" charset="utf-8"></script>
	<script src="../browser/jocly.js" charset="utf-8"></script>
	<script type="module" src="play.js"></script>
</head>

<body style="height:100%">
	<div class="game-zone play-content">
		<!-- ── Barre laterale ────────────────────────────────────────────────
		     Elle remplace le bouton « … » et la barre repliable du pied.
		
		     POURQUOI : vingt et un boutons etaient derriere un repli dont
		     l'etat etait MEMORISE. Qui n'avait jamais clique dessus ne
		     decouvrait ni l'horloge, ni la discussion, ni l'export -- et le
		     repli etait l'etat par defaut.
		
		     Et « toujours visible » ne suffisait pas : vingt et une icones
		     muettes en colonne sont aussi opaques qu'en ligne. Ce qui rend un
		     bouton decouvrable, c'est le LIBELLE a cote -- que la largeur d'un
		     rail permet et que la hauteur d'un pied de page interdisait. Les
		     libelles reprennent les cles tip.* du dictionnaire, deja traduites
		     et jusqu'ici visibles seulement en infobulle, donc invisibles au
		     toucher.
		
		     Les sections suivent l'usage plutot que la technique : on regle
		     l'affichage ET les joueurs ensemble parce que c'est ce qu'on
		     enregistre comme modele ; on ouvre, sauve et reprend une partie
		     ensemble ; la capture est a part parce qu'elle sert rarement. -->
		<nav class="game-sidebar" id="game-sidebar">

			<h2 class="sidebar-title" data-i18n="sidebar.setup">Setup</h2>
			<button id="button-options" class="sidebar-btn" title="View options" data-i18n-title="tip.viewOptions">
				<span class="icon icon-eye"></span><span data-i18n="tip.viewOptions">View options</span>
			</button>
			<button id="button-players" class="sidebar-btn" title="Players" data-i18n-title="tip.players">
				<span class="icon icon-users"></span><span data-i18n="tip.players">Players</span>
			</button>
			<button id="button-template" class="sidebar-btn" title="Save template" data-i18n-title="tip.saveTemplate">
				<span class="icon icon-layout"></span><span data-i18n="tip.saveTemplate">Save template</span>
			</button>

			<h2 class="sidebar-title" data-i18n="sidebar.game">Game</h2>
			<button id="button-pause" class="sidebar-btn" title="Pause" data-i18n-title="tip.pause">
				<span class="icon icon-pause"></span><span data-i18n="tip.pause">Pause</span>
			</button>
			<button id="button-resume" class="sidebar-btn" title="Resume" data-i18n-title="tip.resume" style="display:none">
				<span class="icon icon-play"></span><span data-i18n="tip.resume">Resume</span>
			</button>
			<button id="button-replay" class="sidebar-btn" title="Replay last move" data-i18n-title="tip.replay">
				<span class="icon icon-level-down"></span><span data-i18n="tip.replay">Replay last move</span>
			</button>
			<button id="button-history" class="sidebar-btn" title="History" data-i18n-title="tip.history">
				<span class="icon icon-list"></span><span data-i18n="tip.history">History</span>
			</button>
			<button id="button-save" class="sidebar-btn" title="Save" data-i18n-title="tip.save">
				<span class="icon icon-download"></span><span data-i18n="tip.save">Save</span>
			</button>
			<button id="button-load" class="sidebar-btn" title="Load" data-i18n-title="tip.load">
				<span class="icon icon-upload"></span><span data-i18n="tip.load">Load</span>
			</button>
			<!-- Le vrai selecteur de fichier, cache : c'est le bouton ci-dessus qui
			     le declenche. Il vit a cote de lui plutot qu'ailleurs dans la page,
			     pour qu'on ne le perde pas de vue en deplacant le bouton -- c'est
			     exactement ce qui vient d'arriver en demontant la barre repliable. -->
			<input type="file" id="fileElem" accept="application/json" style="display:none"/>
			<button id="button-clone" class="sidebar-btn" title="Fork" data-i18n-title="tip.fork">
				<span class="icon icon-flow-cascade"></span><span data-i18n="tip.fork">Fork</span>
			</button>

			<h2 class="sidebar-title" data-i18n="sidebar.around">Around the game</h2>
			<button id="button-clock" class="sidebar-btn" title="Clock" data-i18n-title="tip.clock">
				<span class="icon icon-clock"></span><span data-i18n="tip.clock">Clock</span>
			</button>
			<button id="button-chat" class="sidebar-btn" title="Chat" data-i18n-title="tip.chat" style="display:none">
				<span class="icon icon-chat"></span><span data-i18n="tip.chat">Chat</span>
			</button>
			<button id="button-favorite-no" class="sidebar-btn" title="Favorite" data-i18n-title="tip.favorite">
				<span class="icon icon-star-empty"></span><span data-i18n="tip.favorite">Favorite</span>
			</button>
			<button id="button-favorite-yes" class="sidebar-btn" title="Unfavorite" data-i18n-title="tip.unfavorite" style="display:none">
				<span class="icon icon-star"></span><span data-i18n="tip.unfavorite">Unfavorite</span>
			</button>
			<button id="button-help" class="sidebar-btn" title="Rules, credits, about" data-i18n-title="tip.rules">
				<span class="icon icon-info-circled"></span><span data-i18n="tip.rules">Rules</span>
			</button>

			<!-- Rarement employee, et deux de ses trois entrees sont a reprendre :
			     elle ferme la liste plutot que de couper les sections utiles. -->
			<h2 class="sidebar-title" data-i18n="sidebar.capture">Capture</h2>
			<button id="button-snapshot" class="sidebar-btn" title="Take snapshot" data-i18n-title="tip.snapshot">
				<span class="icon icon-camera"></span><span data-i18n="tip.snapshot">Take snapshot</span>
			</button>
			<button id="button-video" class="sidebar-btn" title="Record video" data-i18n-title="tip.recordVideo">
				<span class="icon icon-video"></span><span data-i18n="tip.recordVideo">Record video</span>
			</button>
			<button id="button-camera" class="sidebar-btn" title="Camera view" data-i18n-title="tip.cameraView">
				<span class="icon icon-target"></span><span data-i18n="tip.cameraView">Camera view</span>
			</button>
		</nav>

		<div class="game-main">
		<div class="game-header hidden">
			<div>
				<header class="toolbar toolbar-header">
					<h1 class="title">Hello</h1>
				</header>
			</div>
		</div>
		<div class="game-fullsize">
				<div class="game-area"></div>
		</div>
		<div id="play-warning" class="play-warning hidden">
			<span id="play-warning-text" class="play-warning-text"></span>
			<a id="play-warning-close" class="play-warning-close" data-i18n="common.close">Close</a>
		</div>
		<div class="game-footer">
			<div>
				<footer class="toolbar toolbar-footer">
					<div class="toolbar-actions ephemeral-actions">

						<button id="button-stop-video" class="btn btn-default pull-left hidden" title="Stop recording" data-i18n-title="tip.stopRecording">
							<span class="icon icon-stop"></span>
						</button>

						<h1 id="board-footer-text" class="pull-left title ephemeral-vanish"></h1>

					<!-- Selecteurs de joueurs (humain / IA) -->
					<span class="pull-left player-select-wrap">
						<label class="player-select-label">A</label>
						<select id="select-player-a" class="player-select"></select>
					</span>
					<span class="pull-left player-select-wrap">
						<label class="player-select-label">B</label>
						<select id="select-player-b" class="player-select"></select>
					</span>
					<!-- Skins (2D/3D) : même classe que les sélecteurs de joueurs,
					     donc visible seulement quand la barre de boutons est masquée -->
					<span class="pull-left player-select-wrap" id="skin-select-wrap" style="display:none">
						<select id="select-skin" class="player-select" title="View options" data-i18n-title="tip.viewOptions"></select>
					</span>
					<!-- Actions rapides visibles quand la barre est masquée (même
					     mécanique d'exclusion que les sélecteurs, via player-select-wrap) -->
					<span class="pull-left player-select-wrap" id="quick-actions-wrap">
						<button id="button-takeback" class="btn btn-default" title="Take back" data-i18n-title="tip.takeBack">
							<span class="icon icon-back"></span>
						</button>
						<button id="button-restart" class="btn btn-default" title="Restart" data-i18n-title="tip.restart">
							<span class="icon icon-ccw"></span>
						</button>
					</span>
						<!-- Le plein ecran prend la place de l'ancien bouton « … » : c'est
						     le seul de la barre qui agisse sur la FENETRE et non sur la
						     partie, et c'est aussi celui qu'on cherche a l'endroit ou le
						     replie etait. -->
						<div class="btn-group pull-right" id="fullscreen-group">
							<button id="button-fullscreen" class="btn btn-default" title="Full screen" data-i18n-title="tip.fullscreen">
								<span class="icon icon-resize-full"></span>
							</button>
						</div>
					</div>
				</footer>
			</div>
		</div>
		</div><!-- game-main -->
	</div><!-- game-zone -->
</body>

</html>
