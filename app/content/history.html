<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
		<link rel="icon" href="data:,">
	<title>Tabulon</title>

	<!-- Stylesheets -->
	<link rel="stylesheet" href="tabulon.css">

	<!-- Javascript -->
	<script>
		if (typeof module === 'object') { window.module = module; module = undefined; }
	</script>
	<script src="../node_modules/jquery/dist/jquery.js" charset="utf-8"></script>
	<script src="../browser/jocly.js" charset="utf-8"></script>
	<script type="module" src="history.js"></script>
</head>

<body>
	<div class="window">

		<div class="window-content window-history">

			<div id="moves">
			</div>

		</div>
		<footer class="toolbar toolbar-footer">
			<div class="toolbar-actions">

				<div class="btn-group pull-left">
					<button class="btn btn-default" data-action="start" title="Start" data-i18n-title="tip.start">
						<span class="icon icon-to-start"></span>
					</button>
					<button class="btn btn-default" data-action="stepback" title="Step back" data-i18n-title="tip.stepBack">
						<span class="icon icon-left-dir"></span>
					</button>
					<button class="btn btn-default" data-action="stepforward" title="Step forward" data-i18n-title="tip.stepForward">
						<span class="icon icon-right-dir"></span>
					</button>
					<button class="btn btn-default" data-action="play" title="Play" data-i18n-title="tip.playMoves">
						<span class="icon icon-play"></span>
					</button>
					<button class="btn btn-default" data-action="pause" title="Pause" data-i18n-title="tip.pauseMoves">
						<span class="icon icon-pause"></span>
					</button>
					<button class="btn btn-default" data-action="end" title="End" data-i18n-title="tip.end">
						<span class="icon icon-to-end"></span>
					</button>
				</div>

				<div class="btn-group">				
					<button class="btn btn-default" data-action="save" title="Save book" data-i18n-title="tip.saveBook">
						<span class="icon icon-download"></span>
					</button>
					<button class="btn btn-default" data-action="position" title="Load board state" data-i18n-title="tip.loadBoardState">
						<span class="icon icon-location"></span>
					</button>
					<button class="btn btn-default" data-action="showpos" title="Display board state" data-i18n-title="tip.displayBoardState">
						<span class="icon icon-down-bold"></span>
					</button>
					<button class="btn btn-default" data-action="resume" title="Resume from position" data-i18n-title="tip.resumeFromPosition">
						<span class="icon icon-forward"></span>
					</button>
				</div>


				<button id="button-close" class="btn btn-default pull-right"><span data-i18n="common.close">Close</span></button>
			</div>
		</footer>
	</div>
</body>

</html>
